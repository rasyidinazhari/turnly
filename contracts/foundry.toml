[profile.default]
src = "src"
out = "out"
libs = ["lib"]
network = "monad"
metadata = true
metadata_hash = "none"
use_literal_content = true
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]

# Monad Testnet
eth-rpc-url = "https://testnet-rpc.monad.xyz"
chain_id = 10143

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 100
tab_width = 4
